[project]
name = "tech-challenge-fase02"
version = "0.1.0"
description = "Sistema de recomendação de produtos usando ML e DVC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc[azure]>=3.67.1",
    "mlflow>=3.12.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
