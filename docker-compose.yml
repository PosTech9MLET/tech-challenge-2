name: tech-challenge-fase02

services:
  mlflow:
    build:
      context: .
      target: runtime
    image: tech-challenge-fase02:local
    command:
      [
        "mlflow",
        "server",
        "--backend-store-uri",
        "sqlite:////app/mlruns/mlflow.db",
        "--artifacts-destination",
        "file:///app/mlruns/artifacts",
        "--serve-artifacts",
        "--allowed-hosts",
        "localhost:*,127.0.0.1:*,mlflow,mlflow:5000",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
      ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlruns
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  train:
    build:
      context: .
      target: runtime
    image: tech-challenge-fase02:local
    env_file:
      - .env.docker
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: ["dvc", "repro"]
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./.git:/app/.git:ro
      - ./dvc.lock:/app/dvc.lock
      - ./data:/app/data
      - ./models:/app/models
      - ./.dvc/cache:/app/.dvc/cache

volumes:
  mlflow_data: